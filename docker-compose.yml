services:
  file-service:
    build: .
    networks:
      - shared-network
      - filedb-network
    ports:
      - "6010:6010"
    container_name: file-service
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      com.msinit.log: "true"
      com.msinit.service-name: "fileservice"
    depends_on:
      file-db:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    volumes:
      - file-upload-temp-volume:/tmp
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
      - SERVER_PORT=${SERVER_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - SERVICE_HTTP_CONNECT_TIMEOUT=${SERVICE_HTTP_CONNECT_TIMEOUT}
      - SERVICE_HTTP_READ_TIMEOUT=${SERVICE_HTTP_READ_TIMEOUT}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_DRIVER=${SPRING_DATASOURCE_DRIVER}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
      - SPRING_JPA_DATABASE=${SPRING_JPA_DATABASE}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM}
      - SPRING_SERVLET_MULTIPART_ENABLED=${SPRING_SERVLET_MULTIPART_ENABLED}
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
      - FILE_STORAGE_ENDPOINT=${FILE_STORAGE_ENDPOINT}
      - FILE_STORAGE_REGION=${FILE_STORAGE_REGION}
      - FILE_STORAGE_BUCKET=${FILE_STORAGE_BUCKET}
      - FILE_STORAGE_ACCESS_KEY=${FILE_STORAGE_ACCESS_KEY}
      - FILE_STORAGE_SECRET_KEY=${FILE_STORAGE_SECRET_KEY}
      - FILE_DELETION_RETRY_DELAY=${FILE_DELETION_RETRY_DELAY}
      - FILE_RECONCILIATION_MIN_AGE=${FILE_RECONCILIATION_MIN_AGE}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - SERVICE_SECRET_FILE=${SERVICE_SECRET_FILE}
      - AUTHSERVICE_INTEGRATION=${AUTHSERVICE_INTEGRATION}
      - TELEMETRYSERVICE_INTEGRATION=${TELEMETRYSERVICE_INTEGRATION}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6010/api/file/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
  file-db:
    image: 'postgres:13.1-alpine@sha256:16af09e480c49226f8e7cd4d602ab27e59f434eb255d2b45bd0cfe1defb86fd7'
    container_name: file-db
    restart: unless-stopped
    volumes:
      - file-db-volume:/var/lib/postgresql/data
    networks:
      - filedb-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: seaweedfs
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        printf '{"identities":[{"name":"fileservice","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$${FILE_STORAGE_ACCESS_KEY}" "$${FILE_STORAGE_SECRET_KEY}" > /tmp/s3.json
        exec /usr/bin/weed -logtostderr=true server -dir=/data -volume.max=0 -master.volumePreallocate -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    networks:
      - filedb-network
    volumes:
      - seaweedfs-data:/data
    environment:
      - FILE_STORAGE_ACCESS_KEY=${FILE_STORAGE_ACCESS_KEY}
      - FILE_STORAGE_SECRET_KEY=${FILE_STORAGE_SECRET_KEY}
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 8333" ]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  filedb-network:
    internal: true
  shared-network:
    external: true
volumes:
  file-db-volume:
  file-upload-temp-volume:
  seaweedfs-data:
